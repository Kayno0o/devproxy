name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  # The nginx -t test skips here when the runner has no docker; it runs on every local `bun test`.
  test:
    runs-on: alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: https://git.kaynooo.fr/kaynooo/actions/setup-bun@v1

      - name: check
        run: bun run check

      - name: lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: test
        if: ${{ !cancelled() }}
        run: bun run test
